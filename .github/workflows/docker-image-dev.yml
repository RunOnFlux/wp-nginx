name: Push Docker Hub Images

on:
  push:
    branches:
      - develop

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        run: echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin

      - name: Build and push Docker images
        run: |
          set -e
          mapfile -t json_array < <(jq -r '.[] | [.name, .tag, (.wordpress_source_tag // .tag)] | @tsv' versions.json)
          for element in "${json_array[@]}"; do
            read -r name tag wordpress_source_tag <<< "$element"
            echo "pushing >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> $name"
            docker build --pull -t "runonflux/wp-nginx:dev-$name" \
              --build-arg "BASE_IMAGE=wordpress:$tag" \
              --build-arg "WORDPRESS_SOURCE_IMAGE=wordpress:$wordpress_source_tag" .
            docker push runonflux/wp-nginx:dev-$name
          done
